<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cinzel Decorative"; font-weight: 700; src: url("fonts/cinzel-decorative-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Serif Bengali"; font-weight: 600; src: url("fonts/noto-serif-bengali-bengali-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; src: url("fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      .clip { position: absolute; }
      #bn { left: 0; top: 772px; width: 1920px; text-align: center; font-family: "Noto Serif Bengali", serif; font-weight: 600; font-size: 40px; color: #ffd98a; letter-spacing: 0.04em; text-shadow: 0 2px 8px rgba(30,4,0,0.9); }
      #title { left: 0; top: 820px; width: 1920px; text-align: center; font-family: "Cinzel Decorative", serif; font-weight: 700; font-size: 104px; letter-spacing: 0.06em; line-height: 1.15; white-space: nowrap; }
      #title span { display: inline-block; background: linear-gradient(180deg, #fff6d8 0%, #ffd77a 38%, #d79a2b 62%, #ffe6a6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgba(255,190,90,0.55)) drop-shadow(0 3px 2px rgba(40,6,0,0.8)); }
      #title .sp { width: 0.42em; }
      #divider { left: 610px; top: 954px; width: 700px; height: 30px; transform-origin: 50% 50%; }
      #subtitle { left: 0; top: 984px; width: 1920px; text-align: center; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 40px; color: #ffe9c2; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(30,4,0,0.95); }
    </style>
  </head>
  <body>
    <!-- Transparent title overlay for the final scene. t=0 is 38.75 s on the Remotion master; ends at 44.5 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.75" data-width="1920" data-height="1080">
      <div id="bn" class="clip" data-start="0" data-duration="5.75" data-track-index="0">শুভ মহালয়া</div>
      <div id="title" class="clip" data-start="0" data-duration="5.75" data-track-index="1" aria-label="SHUBHO MAHALAYA"></div>
      <svg id="divider" class="clip" data-start="0" data-duration="5.75" data-track-index="2" viewBox="0 0 700 30">
        <line x1="0" y1="15" x2="300" y2="15" stroke="#e8b85a" stroke-width="1.6" />
        <line x1="400" y1="15" x2="700" y2="15" stroke="#e8b85a" stroke-width="1.6" />
        <path d="M350 3 L362 15 L350 27 L338 15 Z" fill="none" stroke="#ffd77a" stroke-width="1.6" />
        <circle cx="350" cy="15" r="3" fill="#ffd77a" />
        <circle cx="318" cy="15" r="2.4" fill="#e8b85a" /><circle cx="382" cy="15" r="2.4" fill="#e8b85a" />
      </svg>
      <div id="subtitle" class="clip" data-start="0" data-duration="5.75" data-track-index="3">May light triumph over darkness, and goodness prevail.</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bn", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.3);
      const host = document.getElementById("title");
      for (const ch of "SHUBHO MAHALAYA") { const s = document.createElement("span"); if (ch === " ") { s.className = "sp"; s.innerHTML = "&nbsp;"; } else s.textContent = ch; host.appendChild(s); }
      tl.fromTo("#title span", { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out", stagger: 0.05 }, 0.45);
      tl.fromTo("#divider", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power2.out" }, 1.5);
      tl.fromTo("#subtitle", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 1.8);
      tl.to({}, { duration: 0.001 }, 5.749);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
